<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小栗研究所 - 訂單管理系統</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Babel (用來讓瀏覽器看懂 React JSX 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 設定 React 與圖示套件的載入路徑 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>
</head>
<body class="bg-[#FDF8F5]">
  <!-- React 系統會渲染在這個 div 裡面 -->
  <div id="root"></div>

  <!-- React 程式碼開始 -->
  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Calculator, ShoppingBag, Trash2, JapaneseYen, Scale, Plane, User, FileText, PlusCircle, CheckCircle2, AlertCircle, Download, UploadCloud, Loader2 } from 'lucide-react';

    // 定義特殊商品的固定價格表 (防呆：只能選這些，且自動算好台幣)
    const GACHA_PRICES = {
      300: 95,
      400: 120,
      500: 150,
      800: 250
    };

    const OMAMORI_PRICES = {
      300: 120, 500: 180, 600: 210, 700: 250, 
      800: 280, 900: 320, 1000: 350, 1100: 390, 
      1200: 420, 1300: 460, 1500: 530, 2000: 700
    };

    const SHIPPING_RATE_PER_KG = 190;

    // ★ 請在此處貼上你部署後的 Google Apps Script Web App 網址 ★
    const GOOGLE_SHEET_WEBAPP_URL = ""; 

    const KoguriOrderSystem = () => {
      const [orders, setOrders] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      
      const [formData, setFormData] = useState({
        buyerName: '',
        itemName: '',
        category: '一般商品',
        jpyPrice: '',
        exchangeRate: 0.28,
        weight: '',
      });

      const [errors, setErrors] = useState({});

      const exchangeRateOptions = useMemo(() => {
        const options = [];
        for (let rate = 0.25; rate <= 0.30; rate += 0.005) {
          options.push(rate.toFixed(3));
        }
        return options;
      }, []);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        let newValue = value;
        let newFormData = { ...formData, [name]: newValue };

        if (name === 'category') {
          newFormData.jpyPrice = ''; 
          newFormData.weight = '';
          setErrors({}); 

          if (newValue === '一番賞') {
            newFormData.exchangeRate = 0.3; 
          } else if (newValue === '一般商品' || newValue === '平台代標') {
            newFormData.exchangeRate = 0.28; 
          }
        }

        setFormData(newFormData);
        if (errors[name]) {
          setErrors(prev => ({ ...prev, [name]: null }));
        }
      };

      const calculation = useMemo(() => {
        let twdPrice = 0;
        let shippingFee = 0;
        const jpy = parseFloat(formData.jpyPrice) || 0;
        const weight = parseFloat(formData.weight) || 0;
        const rate = parseFloat(formData.exchangeRate);

        if (formData.category === '扭蛋') {
          twdPrice = GACHA_PRICES[jpy] || 0;
          shippingFee = 0;
        } else if (formData.category === '神社御守') {
          twdPrice = OMAMORI_PRICES[jpy] || 0;
          shippingFee = 0;
        } else if (formData.category === '一番賞') {
          twdPrice = Math.ceil(jpy * 0.3);
          shippingFee = Math.ceil(weight * SHIPPING_RATE_PER_KG);
        } else {
          twdPrice = Math.ceil(jpy * rate);
          shippingFee = Math.ceil(weight * SHIPPING_RATE_PER_KG);
        }

        return {
          twdPrice,
          shippingFee,
          total: twdPrice + shippingFee
        };
      }, [formData]);

      const validateForm = () => {
        const newErrors = {};
        if (!formData.buyerName.trim()) newErrors.buyerName = '請填寫訂購人名稱';
        if (!formData.jpyPrice) newErrors.jpyPrice = '請填寫或選擇日幣金額';
        if (formData.jpyPrice <= 0) newErrors.jpyPrice = '金額必須大於 0';
        
        const needsWeight = ['一般商品', '一番賞', '平台代標'].includes(formData.category);
        if (needsWeight && (!formData.weight || formData.weight <= 0)) {
          newErrors.weight = '請填寫正確的商品重量';
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };

      const handleAddOrder = (e) => {
        e.preventDefault();
        
        if (!validateForm()) {
          showToast('表單資料有誤，請檢查紅色提示欄位', 'error');
          return;
        }

        const newOrder = {
          id: Date.now().toString(),
          ...formData,
          jpyPrice: parseFloat(formData.jpyPrice),
          weight: parseFloat(formData.weight) || 0,
          twdPrice: calculation.twdPrice,
          shippingFee: calculation.shippingFee,
          totalPrice: calculation.total,
          date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit' })
        };

        setOrders([newOrder, ...orders]);
        showToast(`成功新增 ${formData.buyerName} 的訂單！`);
        
        setFormData(prev => ({
          ...prev,
          buyerName: '',
          itemName: '',
          jpyPrice: '',
          weight: ''
        }));
      };

      const handleDeleteOrder = (id) => {
        setOrders(orders.filter(order => order.id !== id));
        showToast('已刪除一筆訂單', 'success');
      };

      const handleExportCSV = () => {
        if (orders.length === 0) {
          showToast('目前沒有訂單可以匯出', 'error');
          return;
        }
        
        const headers = ['訂單編號', '登記時間', '訂購人', '分類', '商品名稱', '日幣原價', '匯率', '重量(kg)', '國際運費', '應收台幣'];
        
        const csvContent = [
          headers.join(','),
          ...orders.map(o => [
            o.id,
            `"${o.date}"`,
            `"${o.buyerName}"`,
            o.category,
            `"${o.itemName || ''}"`,
            o.jpyPrice,
            ['扭蛋', '神社御守'].includes(o.category) ? '固定價格' : o.exchangeRate,
            o.weight || 0,
            o.shippingFee,
            o.totalPrice
          ].join(','))
        ].join('\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `小栗研究所_訂單匯出_${new Date().toISOString().slice(0,10)}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('已成功下載 CSV 試算表！');
      };

      const handleSyncToSheets = async () => {
        if (orders.length === 0) {
          showToast('沒有可同步的訂單資料', 'error');
          return;
        }
        if (!GOOGLE_SHEET_WEBAPP_URL) {
          showToast('尚未設定 Google Sheets 網址，請參考說明進行設定', 'error');
          return;
        }

        setIsSyncing(true);
        try {
          const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(orders),
          });

          const result = await response.json();
          if (result.status === 'success') {
            showToast(`成功將 ${result.count} 筆訂單同步至 Google 試算表！`);
          } else {
            throw new Error(result.message);
          }
        } catch (error) {
          console.error('Sync error:', error);
          showToast('同步失敗，請確認 Google Sheet URL 是否正確設定', 'error');
        } finally {
          setIsSyncing(false);
        }
      };

      const summary = useMemo(() => {
        return orders.reduce((acc, order) => {
          acc.totalJpy += order.jpyPrice;
          acc.totalTwd += order.twdPrice;
          acc.totalShipping += order.shippingFee;
          acc.totalRevenue += order.totalPrice;
          return acc;
        }, { totalJpy: 0, totalTwd: 0, totalShipping: 0, totalRevenue: 0 });
      }, [orders]);

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans text-slate-700 relative">
          {toast.show && (
            <div className={`fixed top-4 right-4 z-50 flex items-center p-4 rounded-lg shadow-lg text-white transition-all duration-300 transform translate-y-0 ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
              {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2" /> : <CheckCircle2 className="w-5 h-5 mr-2" />}
              <span className="font-medium tracking-wide">{toast.message}</span>
            </div>
          )}

          <header className="max-w-7xl mx-auto mb-8 text-center flex flex-col items-center">
            <div className="bg-white p-4 rounded-full shadow-sm mb-4 inline-block border-2 border-pink-100 relative">
              <ShoppingBag className="w-10 h-10 text-[#7FB5B5]" />
              <div className="absolute -top-1 -right-1 bg-pink-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">PRO</div>
            </div>
            <h1 className="text-3xl font-bold text-[#5c7a99] mb-2 tracking-wider">🐾 小栗研究所 Koguri Kenkyujo 🌸</h1>
            <p className="text-pink-400 font-medium tracking-widest text-sm bg-pink-50 px-4 py-1 rounded-full">專業版訂單管理試算系統 (含防呆機制)</p>
          </header>

          <div className="max-w-7xl mx-auto grid grid-cols-1 xl:grid-cols-12 gap-6">
            <div className="xl:col-span-4 bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col h-fit">
              <div className="bg-[#fde8e8] px-6 py-4 border-b border-pink-100 flex items-center justify-between">
                <div className="flex items-center">
                  <PlusCircle className="w-5 h-5 text-pink-500 mr-2" />
                  <h2 className="text-lg font-bold text-pink-700">新增登記</h2>
                </div>
              </div>
              
              <form onSubmit={handleAddOrder} className="p-6 space-y-5">
                <div className="space-y-4">
                  <div>
                    <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                      <ShoppingBag className="w-4 h-4 mr-1 text-[#7FB5B5]" /> 商品分類 (影響計價公式)
                    </label>
                    <select name="category" value={formData.category} onChange={handleInputChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400 bg-gray-50 text-gray-700 font-medium">
                      <option value="一般商品">一般商品 (生活/食品/雜貨)</option>
                      <option value="扭蛋">扭蛋 (固定價格/免填運費)</option>
                      <option value="神社御守">神社/御守 (固定價格/免填運費)</option>
                      <option value="一番賞">一番賞 (固定0.3匯率+運費)</option>
                      <option value="平台代標">平台代標 (Mercari/日拍)</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                        <User className="w-4 h-4 mr-1 text-[#7FB5B5]" /> 訂購人 <span className="text-red-400 ml-1">*</span>
                      </label>
                      <input type="text" name="buyerName" value={formData.buyerName} onChange={handleInputChange} className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-gray-50 ${errors.buyerName ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:ring-pink-300'}`} placeholder="如: 王小明" />
                      {errors.buyerName && <p className="text-xs text-red-500 mt-1">{errors.buyerName}</p>}
                    </div>
                    <div>
                      <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                        <FileText className="w-4 h-4 mr-1 text-[#7FB5B5]" /> 商品名稱
                      </label>
                      <input type="text" name="itemName" value={formData.itemName} onChange={handleInputChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-300 bg-gray-50" placeholder="選填" />
                    </div>
                  </div>
                </div>

                <div className="border-t border-dashed border-gray-200 my-2"></div>

                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                        <JapaneseYen className="w-4 h-4 mr-1 text-pink-500" /> 日幣原價 <span className="text-red-400 ml-1">*</span>
                      </label>
                      {formData.category === '扭蛋' ? (
                        <select name="jpyPrice" value={formData.jpyPrice} onChange={handleInputChange} className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-gray-50 font-mono ${errors.jpyPrice ? 'border-red-400' : 'border-gray-200 focus:ring-pink-300'}`}>
                          <option value="">請選擇扭蛋金額</option>
                          {Object.keys(GACHA_PRICES).map(price => <option key={price} value={price}>¥{price}</option>)}
                        </select>
                      ) : formData.category === '神社御守' ? (
                        <select name="jpyPrice" value={formData.jpyPrice} onChange={handleInputChange} className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-gray-50 font-mono ${errors.jpyPrice ? 'border-red-400' : 'border-gray-200 focus:ring-pink-300'}`}>
                          <option value="">請選擇御守金額</option>
                          {Object.keys(OMAMORI_PRICES).map(price => <option key={price} value={price}>¥{price}</option>)}
                        </select>
                      ) : (
                        <input type="number" name="jpyPrice" value={formData.jpyPrice} onChange={handleInputChange} min="0" step="1" placeholder="輸入金額" className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-gray-50 font-mono ${errors.jpyPrice ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:ring-pink-300'}`} />
                      )}
                      {errors.jpyPrice && <p className="text-xs text-red-500 mt-1">{errors.jpyPrice}</p>}
                    </div>

                    {['一般商品', '平台代標', '一番賞'].includes(formData.category) && (
                      <div>
                        <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                          <Calculator className="w-4 h-4 mr-1 text-pink-400" /> 匯率
                        </label>
                        <select name="exchangeRate" value={formData.exchangeRate} onChange={handleInputChange} disabled={formData.category === '一番賞'} className={`w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-300 font-mono ${formData.category === '一番賞' ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-gray-50'}`}>
                          {formData.category === '一番賞' ? <option value="0.3">0.3 (鎖定)</option> : exchangeRateOptions.map(rate => <option key={rate} value={rate}>{rate}</option>)}
                        </select>
                      </div>
                    )}
                  </div>

                  {['一般商品', '一番賞', '平台代標'].includes(formData.category) && (
                    <div>
                      <label className="flex items-center text-sm font-semibold text-gray-600 mb-1">
                        <Scale className="w-4 h-4 mr-1 text-blue-400" /> 商品重量 (kg) <span className="text-red-400 ml-1">*</span>
                      </label>
                      <input type="number" name="weight" value={formData.weight} onChange={handleInputChange} min="0" step="0.001" className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-gray-50 font-mono ${errors.weight ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:ring-blue-300'}`} placeholder="輸入重量 (如: 0.085 = 85g)" />
                      {errors.weight && <p className="text-xs text-red-500 mt-1">{errors.weight}</p>}
                    </div>
                  )}
                </div>

                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4 space-y-2">
                  <div className="flex justify-between text-sm text-gray-600 items-center">
                    <span>商品台幣價：</span><span className="font-mono">NT$ {calculation.twdPrice.toLocaleString()}</span>
                  </div>
                  {['一般商品', '一番賞', '平台代標'].includes(formData.category) ? (
                    <div className="flex justify-between text-sm text-gray-600 items-center">
                      <span className="flex items-center"><Plane className="w-3 h-3 mr-1"/> 預估國際運費：</span>
                      <span className="font-mono text-blue-600">NT$ {calculation.shippingFee.toLocaleString()}</span>
                    </div>
                  ) : (
                    <div className="flex justify-between text-xs text-gray-400 items-center">
                      <span className="flex items-center"><Plane className="w-3 h-3 mr-1"/> 國際運費：</span><span>(已包含於定價中)</span>
                    </div>
                  )}
                  <div className="border-t border-gray-200 pt-2 flex justify-between items-center font-bold">
                    <span className="text-gray-700">應收總額：</span><span className="text-pink-600 font-mono text-xl">NT$ {calculation.total.toLocaleString()}</span>
                  </div>
                </div>

                <button type="submit" className="w-full py-3.5 mt-2 bg-[#5c7a99] hover:bg-[#4a637c] text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center group active:scale-[0.98]">
                  <CheckCircle2 className="w-5 h-5 mr-2 group-hover:scale-110 transition-transform" /> 確認並登記訂單
                </button>
              </form>
            </div>

            <div className="xl:col-span-8 flex flex-col space-y-6">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                  <div className="text-xs text-gray-500 mb-1 font-bold">已登錄筆數</div>
                  <div className="text-2xl font-bold text-[#5c7a99]">{orders.length} <span className="text-sm font-normal text-gray-400">筆</span></div>
                </div>
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                  <div className="text-xs text-gray-500 mb-1 font-bold">日幣支出總計</div>
                  <div className="text-xl font-bold text-gray-700 font-mono">¥ {summary.totalJpy.toLocaleString()}</div>
                </div>
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                  <div className="text-xs text-gray-500 mb-1 font-bold">預估運費總計</div>
                  <div className="text-xl font-bold text-blue-500 font-mono">$ {summary.totalShipping.toLocaleString()}</div>
                </div>
                <div className="bg-[#5c7a99] p-4 rounded-2xl shadow-md border border-slate-200 flex flex-col justify-center relative overflow-hidden">
                  <div className="absolute top-0 right-0 opacity-10"><Calculator className="w-16 h-16 transform translate-x-2 -translate-y-2" /></div>
                  <div className="text-xs text-blue-100 mb-1 font-bold relative z-10">台幣應收總額</div>
                  <div className="text-2xl font-bold text-white font-mono relative z-10">$ {summary.totalRevenue.toLocaleString()}</div>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col min-h-[400px]">
                <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center flex-wrap gap-3">
                  <h2 className="text-lg font-bold text-[#5c7a99] flex items-center">
                    <FileText className="w-5 h-5 mr-2" /> 訂單試算總表 (明細)
                  </h2>
                  <div className="flex items-center space-x-2">
                    <button onClick={handleExportCSV} className="flex items-center px-3 py-1.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors shadow-sm active:scale-95">
                      <Download className="w-4 h-4 mr-1.5" /> 匯出 CSV
                    </button>
                    <button onClick={handleSyncToSheets} disabled={isSyncing} className="flex items-center px-3 py-1.5 text-sm font-medium text-white bg-[#7FB5B5] border border-transparent rounded-lg hover:bg-[#6ca4a4] transition-colors shadow-sm disabled:opacity-70 active:scale-95">
                      {isSyncing ? <Loader2 className="w-4 h-4 mr-1.5 animate-spin" /> : <UploadCloud className="w-4 h-4 mr-1.5" />}
                      {isSyncing ? '同步中...' : '上傳至 Google 試算表'}
                    </button>
                  </div>
                </div>
                
                <div className="overflow-x-auto flex-1">
                  {orders.length === 0 ? (
                    <div className="h-full min-h-[300px] flex flex-col items-center justify-center p-12 text-gray-400">
                      <div className="bg-slate-50 p-6 rounded-full mb-4"><FileText className="w-12 h-12 text-slate-300" /></div>
                      <p className="font-medium text-slate-500">尚無資料，請由左側面板新增訂單</p>
                      <p className="text-sm mt-2">系統會自動依照分類套用計價規則</p>
                    </div>
                  ) : (
                    <table className="w-full text-left border-collapse min-w-[700px]">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 text-sm border-b border-slate-200">
                          <th className="p-3 font-semibold whitespace-nowrap pl-6">建立時間</th>
                          <th className="p-3 font-semibold whitespace-nowrap">訂購人</th>
                          <th className="p-3 font-semibold min-w-[140px]">分類 / 商品</th>
                          <th className="p-3 font-semibold text-right">日幣 (公式)</th>
                          <th className="p-3 font-semibold text-right">重量/運費</th>
                          <th className="p-3 font-bold text-right text-[#5c7a99]">應收台幣</th>
                          <th className="p-3 font-semibold text-center pr-6">操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        {orders.map((order, idx) => (
                          <tr key={order.id} className={`border-b border-slate-100 hover:bg-pink-50/50 transition-colors text-sm ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/30'}`}>
                            <td className="p-3 pl-6 text-gray-400 text-xs font-mono">{order.date}</td>
                            <td className="p-3 font-bold text-gray-700">{order.buyerName}</td>
                            <td className="p-3">
                              <div className={`inline-block px-2 py-0.5 rounded text-xs font-bold mb-1 
                                ${order.category === '扭蛋' ? 'bg-yellow-100 text-yellow-700' : 
                                  order.category === '神社御守' ? 'bg-red-100 text-red-700' : 
                                  order.category === '一番賞' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                {order.category}
                              </div>
                              <div className="text-gray-600 truncate max-w-[150px]" title={order.itemName}>{order.itemName || '-'}</div>
                            </td>
                            <td className="p-3 text-right">
                              <div className="font-mono text-gray-700">¥{order.jpyPrice.toLocaleString()}</div>
                              <div className="text-[11px] text-gray-400">
                                {['扭蛋', '神社御守'].includes(order.category) ? '(固定表價)' : `(x${order.exchangeRate})`}
                              </div>
                            </td>
                            <td className="p-3 text-right">
                              {['扭蛋', '神社御守'].includes(order.category) ? (
                                <div className="text-[11px] text-gray-400 bg-gray-100 rounded px-1 inline-block">已含運</div>
                              ) : (
                                <>
                                  <div className="text-gray-700 font-mono">{order.weight} kg</div>
                                  <div className="text-xs text-blue-500 font-mono">+${order.shippingFee.toLocaleString()}</div>
                                </>
                              )}
                            </td>
                            <td className="p-3 text-right font-bold text-pink-600 font-mono text-base">
                              ${order.totalPrice.toLocaleString()}
                            </td>
                            <td className="p-3 text-center pr-6">
                              <button onClick={() => handleDeleteOrder(order.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors" title="刪除紀錄">
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<KoguriOrderSystem />);
  </script>
</body>
</html>
